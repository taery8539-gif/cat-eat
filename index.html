<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>밥먹었냥 - Cozy Meadow</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#fcfaed",
            "surface-dim": "#dcdace",
            "surface-container": "#f0eee1",
            "surface-container-low": "#f6f4e7",
            "surface-container-high": "#eae9dc",
            "surface-container-highest": "#e4e3d6",
            "surface-bright": "#fcfaed",
            "on-surface": "#1b1c15",
            "on-surface-variant": "#43493b",
            "primary": "#416916",
            "primary-container": "#8dba5e",
            "on-primary": "#ffffff",
            "secondary": "#0c6780",
            "secondary-container": "#9ae1ff",
            "on-secondary-container": "#09657f",
            "tertiary": "#725a39",
            "tertiary-container": "#c5a881",
            "outline": "#73796a",
            "outline-variant": "#c3c9b7",
            "kakao": "#FEE500",
            "kakao-text": "#191919",
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "2.5rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["Be Vietnam Pro", "sans-serif"],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="antialiased selection:bg-primary/20">

  <div id="app-wrapper" class="bg-grain">
    
    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md px-5 py-3.5 border-b border-surface-container-high flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-2xl bg-primary/10 border-2 border-primary/20 flex items-center justify-center text-primary font-bold shadow-inner">
          🐾
        </div>
        <div>
          <h1 class="font-headline font-extrabold text-xl tracking-tight text-primary flex items-center gap-1">
            밥먹었냥
          </h1>
          <p class="text-[11px] text-on-surface-variant font-medium -mt-0.5">치즈 공동 돌봄 장부</p>
        </div>
      </div>

      <!-- Kakao User Profile Button -->
      <button id="user-profile-btn" onclick="openKakaoLoginModal()" class="flex items-center gap-2 bg-surface-container-low border-2 border-dashed border-outline-variant hover:border-primary px-3 py-1.5 rounded-full transition-all group">
        <div id="header-user-avatar" class="w-6 h-6 rounded-full bg-kakao text-kakao-text font-bold text-xs flex items-center justify-center shadow-xs border border-amber-300">
          🔑
        </div>
        <span id="header-user-name" class="text-xs font-bold text-on-surface max-w-[80px] truncate">
          로그인
        </span>
        <span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-primary transition-colors">
          expand_more
        </span>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 pb-28 px-4 pt-4 relative">
      
      <!-- Hero / Cat Stage Section -->
      <section class="flex flex-col items-center pt-3 pb-6 relative" id="cat-stage">
        
        <!-- Interactive Speech Bubble -->
        <div id="speech-bubble" onclick="onCatClick(event)" class="relative bg-surface border-[3px] border-dashed border-outline-variant font-speech text-on-surface px-5 py-3.5 rounded-2xl max-w-[310px] text-center mb-5 shadow-sm hover:scale-[1.02] transition-transform cursor-pointer select-none">
          <div class="flex items-center justify-center gap-2">
            <span id="speech-emoji" class="text-2xl animate-bounce-slow">💚</span>
            <span id="speech-text" class="text-base font-bold tracking-tight text-on-surface">
              오늘도 잘 지내고 있어요!
            </span>
          </div>
          <!-- Bubble Tail -->
          <div class="absolute -bottom-[12px] left-1/2 -translate-x-1/2 bubble-tail-border"></div>
          <div class="absolute -bottom-[9px] left-1/2 -translate-x-1/2 bubble-tail-bg"></div>
        </div>

        <!-- Cheese Cat Stage Container -->
        <div class="relative w-48 h-48 my-2 cat-float cursor-pointer select-none" onclick="onCatClick(event)">
          <!-- Dynamic Cat Illustration -->
          <div id="cat-illustration-container" class="w-full h-full flex items-center justify-center">
            <!-- Rendered dynamically via JS SVG graphic -->
          </div>

          <!-- Status Particles / Floating Effects -->
          <div id="cat-particle-container" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <!-- Bento Box Status Cards -->
        <div class="grid grid-cols-2 gap-3 w-full mt-3">
          
          <!-- Last Fed Card -->
          <div class="bg-surface-bright/90 backdrop-blur-xs border-2 border-dashed border-outline-variant rounded-2xl p-3.5 shadow-xs flex flex-col relative overflow-hidden">
            <div class="absolute -right-2 -bottom-2 text-4xl opacity-10 pointer-events-none">🍚</div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-bold text-on-surface-variant bg-surface-container px-2 py-0.5 rounded-full">
                마지막 급식
              </span>
              <span id="last-fed-icon" class="text-xs">🥣</span>
            </div>
            <div id="last-fed-time" class="font-headline font-bold text-base text-on-surface mb-2">
              기록 없음
            </div>
            <div class="mt-auto pt-1 flex items-center gap-1.5 border-t border-surface-container-high/60">
              <div id="last-fed-avatar" class="w-4 h-4 rounded-full bg-primary/20 text-primary text-[9px] font-bold flex items-center justify-center">
                ?
              </div>
              <span id="last-fed-detail" class="text-xs text-on-surface-variant font-medium truncate">
                급식 기록 대기
              </span>
            </div>
          </div>

          <!-- Last Seen Card -->
          <div class="bg-surface-bright/90 backdrop-blur-xs border-2 border-dashed border-outline-variant rounded-2xl p-3.5 shadow-xs flex flex-col relative overflow-hidden">
            <div class="absolute -right-2 -bottom-2 text-4xl opacity-10 pointer-events-none">👀</div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-bold text-on-surface-variant bg-surface-container px-2 py-0.5 rounded-full">
                마지막 목격
              </span>
              <span id="last-seen-status-icon" class="text-xs">🔍</span>
            </div>
            <div id="last-seen-time" class="font-headline font-bold text-base text-on-surface mb-2">
              기록 없음
            </div>
            <div class="mt-auto pt-1 flex items-center gap-1.5 border-t border-surface-container-high/60">
              <div id="last-seen-avatar" class="w-4 h-4 rounded-full bg-secondary/20 text-secondary text-[9px] font-bold flex items-center justify-center">
                ?
              </div>
              <span id="last-seen-detail" class="text-xs text-on-surface-variant font-medium truncate">
                목격 기록 대기
              </span>
            </div>
          </div>

        </div>

      </section>

      <!-- History Feed Section -->
      <section class="mt-2">
        <div class="flex items-center justify-between mb-3 px-1">
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-primary text-xl">energy_savings_leaf</span>
            <h2 class="font-headline font-bold text-lg text-on-surface">치즈의 기록</h2>
            <span id="history-count" class="text-xs font-bold text-on-surface-variant bg-surface-container px-2 py-0.5 rounded-full">0건</span>
          </div>

          <!-- Quick Test Demo Options Menu Toggle -->
          <button onclick="toggleDemoDrawer()" class="text-xs text-on-surface-variant underline hover:text-primary font-medium">
            시연 도구 ⚙️
          </button>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-2 mb-3 bg-surface-container-low p-1 rounded-2xl border border-surface-container-high">
          <button id="filter-all" onclick="setFilter('all')" class="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all bg-surface shadow-xs text-primary">
            전체
          </button>
          <button id="filter-feeding" onclick="setFilter('feeding')" class="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all text-on-surface-variant hover:text-on-surface">
            🍚 급식
          </button>
          <button id="filter-sighting" onclick="setFilter('sighting')" class="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all text-on-surface-variant hover:text-on-surface">
            👀 목격
          </button>
        </div>

        <!-- Timeline List Container -->
        <div id="history-list" class="flex flex-col gap-2.5">
          <!-- Rendered dynamically by JS -->
        </div>

      </section>

      <!-- Demo Options Drawer (Collapsible) -->
      <div id="demo-drawer" class="hidden mt-6 p-4 bg-surface-container-low border-2 border-dashed border-outline-variant rounded-2xl text-xs space-y-2">
        <div class="font-bold text-on-surface flex items-center justify-between">
          <span>⚙️ MVP 시연 및 테스트 도구</span>
          <button onclick="toggleDemoDrawer()" class="text-on-surface-variant">✕</button>
        </div>
        <p class="text-on-surface-variant">버튼을 눌러 24시간 경과 상태를 즉시 테스트해볼 수 있습니다.</p>
        <div class="flex flex-wrap gap-2 pt-1">
          <button onclick="simulate24hPassed()" class="btn-pressable px-3 py-1.5 bg-amber-100 text-amber-900 font-bold rounded-xl border border-amber-300">
            🚨 24시간 이상 경과 시뮬레이션
          </button>
          <button onclick="simulateResetDemoData()" class="btn-pressable px-3 py-1.5 bg-slate-100 text-slate-800 font-bold rounded-xl border border-slate-300">
            🔄 시연 데이터 초기화
          </button>
        </div>
      </div>

    </main>

    <!-- Floating Action Button (FAB) -->
    <div class="fixed bottom-6 right-1/2 translate-x-[180px] max-w-[440px] z-30">
      <button onclick="openRecordModal()" class="btn-pressable btn-primary px-5 py-3.5 rounded-full font-headline font-bold text-base flex items-center gap-2 shadow-lg hover:scale-105 active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-2xl">add</span>
        기록 등록
      </button>
    </div>

    <!-- Modal 1: Quick Add Record Modal -->
    <div id="record-modal" class="hidden fixed inset-0 z-50 flex items-end justify-center modal-overlay p-0 sm:p-4 animate-pop">
      <div class="bg-surface w-full max-w-[440px] rounded-t-3xl sm:rounded-3xl border-t-2 sm:border-2 border-outline-variant p-5 shadow-2xl overflow-y-auto max-h-[90vh]">
        
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-surface-container-high">
          <div>
            <h3 class="font-headline font-bold text-lg text-on-surface">기록 등록</h3>
            <p class="text-xs text-on-surface-variant">치즈의 최신 소식을 등록해 주세요</p>
          </div>
          <button onclick="closeRecordModal()" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface">
            ✕
          </button>
        </div>

        <!-- Active Logged In Kakao User Info -->
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-2.5 mb-4 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div id="modal-user-avatar" class="w-6 h-6 rounded-full bg-kakao font-bold text-xs flex items-center justify-center border border-amber-300">
              👤
            </div>
            <span class="text-xs font-bold text-amber-950">
              작성자: <span id="modal-user-name">카카오 사용자</span>
            </span>
          </div>
          <button onclick="openKakaoLoginModal()" class="text-[11px] font-bold text-amber-800 underline">
            계정 변경
          </button>
        </div>

        <!-- Record Type Tabs -->
        <div class="flex gap-2 mb-4 bg-surface-container-low p-1 rounded-2xl border border-surface-container-high">
          <button id="tab-feeding" onclick="switchRecordTab('feeding')" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-surface text-primary shadow-xs">
            🍚 급식 기록
          </button>
          <button id="tab-sighting" onclick="switchRecordTab('sighting')" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-on-surface-variant hover:text-on-surface">
            👀 목격 기록
          </button>
        </div>

        <!-- Form Inputs -->
        <form id="record-form" onsubmit="handleRecordSubmit(event)" class="space-y-4">
          
          <!-- Date / Time Input -->
          <div>
            <label class="block text-xs font-bold text-on-surface-variant mb-1">기록 시각</label>
            <input type="datetime-local" id="input-datetime" required class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-3 py-2 text-sm font-medium text-on-surface focus:outline-none focus:border-primary">
          </div>

          <!-- FEEDING OPTIONS -->
          <div id="feeding-fields">
            <label class="block text-xs font-bold text-on-surface-variant mb-1.5">음식 종류 (필수)</label>
            <div class="grid grid-cols-3 gap-2 mb-3">
              <label class="cursor-pointer">
                <input type="radio" name="foodType" value="사료" checked class="peer hidden">
                <div class="text-center py-2 px-1 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                  🍚 사료
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="foodType" value="습식" class="peer hidden">
                <div class="text-center py-2 px-1 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                  🥫 습식
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="foodType" value="닭가슴살" class="peer hidden">
                <div class="text-center py-2 px-1 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                  🍗 닭가슴살
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="foodType" value="츄르" class="peer hidden">
                <div class="text-center py-2 px-1 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                  🍫 츄르
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="foodType" value="물" class="peer hidden">
                <div class="text-center py-2 px-1 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                  💧 물
                </div>
              </label>
            </div>

            <label class="block text-xs font-bold text-on-surface-variant mb-1.5">고양이 확인 여부</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="catSeen" value="true" checked class="peer hidden">
                <div class="text-center py-2 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-secondary peer-checked:bg-secondary/10 peer-checked:text-secondary transition-all">
                  😺 봤어요
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="catSeen" value="false" class="peer hidden">
                <div class="text-center py-2 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-tertiary peer-checked:bg-tertiary/10 peer-checked:text-tertiary transition-all">
                  🥣 못 봤어요
                </div>
              </label>
            </div>
          </div>

          <!-- SIGHTING OPTIONS -->
          <div id="sighting-fields" class="hidden">
            <label class="block text-xs font-bold text-on-surface-variant mb-1.5">고양이 상태 (필수)</label>
            <div class="space-y-2">
              <label class="block cursor-pointer">
                <input type="radio" name="sightingStatus" value="건강해 보여요" checked class="peer hidden">
                <div class="flex items-center gap-2 p-2.5 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary transition-all">
                  <span>😊</span> 건강해 보여요
                </div>
              </label>
              <label class="block cursor-pointer">
                <input type="radio" name="sightingStatus" value="조금 이상해 보여요" class="peer hidden">
                <div class="flex items-center gap-2 p-2.5 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-amber-600 peer-checked:bg-amber-50 peer-checked:text-amber-700 transition-all">
                  <span>😿</span> 조금 이상해 보여요
                </div>
              </label>
              <label class="block cursor-pointer">
                <input type="radio" name="sightingStatus" value="다친 것 같아요" class="peer hidden">
                <div class="flex items-center gap-2 p-2.5 text-xs font-bold rounded-2xl border-2 border-outline-variant peer-checked:border-red-600 peer-checked:bg-red-50 peer-checked:text-red-700 transition-all">
                  <span>🚨</span> 다친 것 같아요
                </div>
              </label>
            </div>
          </div>

          <!-- Optional Photo Attachment -->
          <div>
            <label class="block text-xs font-bold text-on-surface-variant mb-1">사진 첨부 (선택 1장)</label>
            <div class="flex items-center gap-3">
              <label class="btn-pressable btn-secondary px-3 py-2 rounded-2xl text-xs font-bold flex items-center gap-1 cursor-pointer">
                <span class="material-symbols-outlined text-base">photo_camera</span>
                사진 선택
                <input type="file" id="input-photo" accept="image/*" onchange="handlePhotoSelect(event)" class="hidden">
              </label>
              <div id="photo-preview-container" class="hidden relative w-12 h-12 rounded-xl overflow-hidden border-2 border-primary">
                <img id="photo-preview-img" src="" class="w-full h-full object-cover">
                <button type="button" onclick="removePhoto()" class="absolute top-0 right-0 bg-red-600 text-white w-4 h-4 rounded-bl flex items-center justify-center text-[10px]">✕</button>
              </div>
            </div>
          </div>

          <!-- Optional Memo -->
          <div>
            <label class="block text-xs font-bold text-on-surface-variant mb-1">메모 (선택)</label>
            <textarea id="input-memo" rows="2" placeholder="특이사항이나 장소를 남겨주세요..." class="w-full bg-surface-container-low border-2 border-outline-variant rounded-2xl px-3 py-2 text-xs font-medium text-on-surface focus:outline-none focus:border-primary resize-none"></textarea>
          </div>

          <!-- Submit Action Buttons -->
          <div class="pt-2 flex gap-2">
            <button type="button" onclick="closeRecordModal()" class="flex-1 py-3 btn-pressable btn-secondary rounded-2xl font-bold text-xs">
              취소
            </button>
            <button type="submit" class="flex-1 py-3 btn-pressable btn-primary rounded-2xl font-bold text-xs shadow-md">
              등록 완료 🐾
            </button>
          </div>

        </form>
      </div>
    </div>

    <!-- Modal 2: Kakao Login & Caretaker Account Switcher Modal -->
    <div id="kakao-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4 animate-pop">
      <div class="bg-surface w-full max-w-[360px] rounded-3xl border-2 border-outline-variant p-5 shadow-2xl">
        <div class="text-center mb-4">
          <div class="w-12 h-12 rounded-full bg-kakao text-kakao-text mx-auto flex items-center justify-center text-2xl font-black mb-2 shadow-sm border border-amber-300">
            💬
          </div>
          <h3 class="font-headline font-bold text-lg text-on-surface">카카오 계정 로그인</h3>
          <p class="text-xs text-on-surface-variant mt-0.5">
            급식 기록에 표시될 카카오 계정을 선택해주세요.
          </p>
        </div>

        <!-- Preset Caretaker Accounts -->
        <div class="space-y-2 mb-4">
          <button onclick="selectKakaoPreset('태리')" class="w-full p-3 rounded-2xl border-2 border-outline-variant hover:border-amber-400 bg-surface-container-low flex items-center justify-between text-left transition-all group">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-amber-200 text-amber-900 font-bold text-xs flex items-center justify-center">태</div>
              <div>
                <div class="font-bold text-xs text-on-surface">태리</div>
                <div class="text-[10px] text-on-surface-variant">고정 급식자 #1</div>
              </div>
            </div>
            <span class="text-xs font-bold text-amber-700 opacity-0 group-hover:opacity-100 transition-opacity">선택 ➔</span>
          </button>

          <button onclick="selectKakaoPreset('민수')" class="w-full p-3 rounded-2xl border-2 border-outline-variant hover:border-amber-400 bg-surface-container-low flex items-center justify-between text-left transition-all group">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-sky-200 text-sky-900 font-bold text-xs flex items-center justify-center">민</div>
              <div>
                <div class="font-bold text-xs text-on-surface">민수</div>
                <div class="text-[10px] text-on-surface-variant">고정 급식자 #2</div>
              </div>
            </div>
            <span class="text-xs font-bold text-amber-700 opacity-0 group-hover:opacity-100 transition-opacity">선택 ➔</span>
          </button>

          <button onclick="selectKakaoPreset('지은')" class="w-full p-3 rounded-2xl border-2 border-outline-variant hover:border-amber-400 bg-surface-container-low flex items-center justify-between text-left transition-all group">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-rose-200 text-rose-900 font-bold text-xs flex items-center justify-center">지</div>
              <div>
                <div class="font-bold text-xs text-on-surface">지은</div>
                <div class="text-[10px] text-on-surface-variant">고정 급식자 #3</div>
              </div>
            </div>
            <span class="text-xs font-bold text-amber-700 opacity-0 group-hover:opacity-100 transition-opacity">선택 ➔</span>
          </button>
        </div>

        <!-- Custom Kakao Name Input -->
        <div class="pt-2 border-t border-surface-container-high">
          <label class="block text-[11px] font-bold text-on-surface-variant mb-1">직접 카카오 닉네임 입력</label>
          <div class="flex gap-2">
            <input type="text" id="custom-kakao-name" placeholder="닉네임 입력..." class="flex-1 bg-surface-container-low border-2 border-outline-variant rounded-xl px-3 py-1.5 text-xs font-bold text-on-surface focus:outline-none focus:border-amber-400">
            <button onclick="selectKakaoCustom()" class="btn-pressable btn-kakao px-3 py-1.5 rounded-xl text-xs font-bold">
              입력
            </button>
          </div>
        </div>

        <button onclick="closeKakaoLoginModal()" class="w-full mt-4 py-2 text-xs font-bold text-on-surface-variant hover:text-on-surface">
          닫기
        </button>

      </div>
    </div>

    <!-- Modal 3: Photo Zoom View -->
    <div id="photo-zoom-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4" onclick="closePhotoZoom()">
      <div class="relative max-w-[90vw] max-h-[80vh]">
        <img id="photo-zoom-img" src="" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl object-contain border-4 border-surface">
        <button class="absolute -top-4 -right-4 bg-surface text-on-surface w-8 h-8 rounded-full font-bold shadow-md flex items-center justify-center">✕</button>
      </div>
    </div>

  </div>

  <script src="images_b64.js"></script>
  <script src="app.js"></script>
</body>
</html>
